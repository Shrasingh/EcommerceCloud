name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`; no database connection is needed.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # The build needs no secrets: Clerk, Stripe and the database are only
      # used at request time. Deployments are handled by Vercel's Git integration.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
