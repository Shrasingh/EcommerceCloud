# Dependabot opens PRs against the default branch (main); there is no
# permanent development/staging branch in this solo project.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The Prisma CLI, client and adapter must stay on the same version, so they
    # are bumped together. Groups are matched in order: keep `prisma` first.
    groups:
      prisma:
        patterns: ["prisma", "@prisma/*"]
      minor-and-patch:
        update-types: [minor, patch]
    # A Prisma major (e.g. 6 -> 7) needs schema, prisma.config.ts and client
    # adapter changes that Dependabot cannot make; do it as a deliberate PR.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      # Tailwind CSS 4 moves the PostCSS plugin to @tailwindcss/postcss, replaces
      # the `@tailwind` directives and changes the config format, so 3 -> 4 is a
      # manual migration (Dependabot PR #6 fails typecheck).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
